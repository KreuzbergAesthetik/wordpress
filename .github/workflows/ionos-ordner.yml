name: IONOS Ordner anzeigen

# Meldet sich mit dem SFTP-Zugang an und listet nur Ordnernamen auf, damit der Pfad für IONOS_THEME_PATH stimmt.
# Dieser Ablauf lädt nichts hoch und ändert nichts auf dem Server.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ionos-production
    steps:
      - name: Anmelden und Ordner auflisten
        shell: bash
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          IONOS_KNOWN_HOSTS: ${{ secrets.IONOS_KNOWN_HOSTS }}
        run: |
          set -uo pipefail
          for key in IONOS_HOST IONOS_USER LFTP_PASSWORD IONOS_KNOWN_HOSTS; do
            if [ -z "${!key}" ]; then echo "::error::Zugang noch nicht eingerichtet: $key"; exit 1; fi
          done
          [[ "$IONOS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$IONOS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          lftp --env-password -u "$IONOS_USER" "sftp://$IONOS_HOST" <<'EOF' 2>&1 | tee ordner.txt
          set cmd:fail-exit no
          set net:max-retries 2
          set net:timeout 25
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
          echo "=== Aktueller Ordner nach der Anmeldung ==="
          pwd
          echo "=== Inhalt ==="
          cls -1
          echo "=== /wordpress/wp-content ==="
          cls -1 /wordpress/wp-content
          echo "=== wp-content ==="
          cls -1 wp-content
          echo "=== themes (relativ) ==="
          cls -1 themes
          echo "=== /themes ==="
          cls -1 /themes
          bye
          EOF
          {
            echo "### Ordner auf dem Server (nur Namen)"
            echo '```'
            cat ordner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
